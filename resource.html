<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resource Viewer — LibraArchive</title>
  <meta name="description" content="View and study free class notes and study guides on LibraArchive." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span>LibraArchive</span>
      </a>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <nav class="nav-links" id="nav-links" aria-label="Primary">
        <a href="index.html">Browse</a>
        <a href="contribute.html">Submit / Request</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="viewer-shell">
    <div class="container">
      <a class="back-link" href="index.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Back to All Resources</span>
      </a>

      <div id="viewer-container">
        <div class="empty-state">
          <p>Loading study resource...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <span class="footer-brand">LibraArchive</span> &mdash; Free, open learning notes for students everywhere.
      </div>
      <div class="footer-links">
        <a href="index.html">Browse</a>
        <a href="contribute.html">Submit / Request</a>
        <a href="about.html">About &amp; FAQ</a>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
